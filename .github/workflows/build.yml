name: Build Clip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\Clip.sln --configfile NuGet.Config -p:Platform=x64

      - name: Build
        run: dotnet build .\Clip.sln --no-restore -c Release -p:Platform=x64

      - name: Publish
        shell: pwsh
        run: .\scripts\publish-unpackaged.ps1 -Configuration Release -Runtime win-x64 -Platform x64

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path "artifacts\Clip-win-x64\*" -DestinationPath "artifacts\Clip-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clip-win-x64
          path: artifacts\Clip-win-x64.zip
